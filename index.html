<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#441505" />
    <meta name="color-scheme" content="dark" />
    <title>Gunnar Arias — Full-Stack Developer</title>
    <meta name="description" content="Backend-leaning full-stack developer and Computer Science student in Kristianstad, Sweden. REST APIs, auth, tests and deploys. See the projects and get in touch." />
    <meta name="author" content="Gunnar Arias" />
    <link rel="canonical" href="https://gunnarwrld.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Gunnar Arias — Full-Stack Developer" />
    <meta property="og:description" content="Backend-leaning full-stack developer and Computer Science student in Kristianstad, Sweden. REST APIs, auth, tests and deploys." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gunnarwrld.com/" />
    <meta property="og:site_name" content="gunnarwrld.com" />
    <meta property="og:image" content="https://gunnarwrld.com/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gunnar Arias, full-stack developer, with the star mascot" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gunnar Arias — Full-Stack Developer" />
    <meta name="twitter:description" content="Backend-leaning full-stack developer and Computer Science student in Kristianstad, Sweden. REST APIs, auth, tests and deploys." />
    <meta name="twitter:image" content="https://gunnarwrld.com/api/og" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" href="/fonts/alfa-slab-one-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/work-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The mascot is the largest thing on the first screen: fetch it before the script asks for it. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/mascot/estrella-480.avif 480w, /mascot/estrella-960.avif 960w"
      imagesizes="(min-width: 1024px) 26rem, 62vw"
      fetchpriority="high"
    />
    <!-- Scroll reveals only hide content when scripts are running. -->
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
