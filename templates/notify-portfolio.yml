# Copy to .github/workflows/notify-portfolio.yml in a project repository.
# Repository secret required: PORTFOLIO_DISPATCH_TOKEN
# The called workflow has to be on PersonalPortfolio's default branch first.

name: Notify portfolio

on:
  push:

permissions: {}

jobs:
  dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: gunnarwrld/PersonalPortfolio/.github/workflows/portfolio-dispatch.yml@main
    secrets:
      PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
